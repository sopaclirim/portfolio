<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Çlirim Sopa — Software Developer with a degree in Computer Science and Engineering. Full-stack web & mobile." />
    <title>Çlirim Sopa — Software Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.add('preloading');
      })();
    </script>
    <style>
      :root {
        --pl-bg: #fbfbfd;
        --pl-fg: #0f172a;
        --pl-muted: #52607a;
        --pl-line: #e2e8f0;
        --pl-accent: #2563eb;
        --pl-accent2: #0891b2;
      }
      [data-theme='dark'] {
        --pl-bg: #070a10;
        --pl-fg: #eef2f8;
        --pl-muted: #9aa7bd;
        --pl-line: #212a3a;
        --pl-accent: #56a2ff;
        --pl-accent2: #2ad4e6;
      }
      html.preloading {
        overflow: hidden;
      }
      html.preloading .animate-fade-up {
        animation-play-state: paused;
      }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--pl-bg);
        transition: transform 0.85s cubic-bezier(0.76, 0, 0.24, 1);
        will-change: transform;
      }
      #preloader::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 640px;
        height: 640px;
        max-width: 90vw;
        max-height: 90vw;
        transform: translate(-50%, -60%);
        background: radial-gradient(
          circle,
          color-mix(in srgb, var(--pl-accent) 16%, transparent),
          transparent 62%
        );
        filter: blur(20px);
        pointer-events: none;
      }
      #preloader.is-done {
        transform: translateY(-100%);
      }

      .pl-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 0 24px;
        transition: opacity 0.45s ease, transform 0.55s ease;
      }
      #preloader.is-done .pl-inner {
        opacity: 0;
        transform: translateY(-14px);
      }

      .pl-mark {
        width: 58px;
        height: 58px;
        overflow: visible;
      }
      .pl-stroke {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: pl-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards;
      }
      .pl-stroke.d2 {
        animation-delay: 0.32s;
      }
      @keyframes pl-draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      .pl-name {
        font-family: 'Sora', ui-sans-serif, system-ui, sans-serif;
        font-weight: 600;
        font-size: clamp(1.6rem, 6vw, 2.05rem);
        letter-spacing: -0.02em;
        color: var(--pl-fg);
        opacity: 0;
        transform: translateY(12px);
        filter: blur(8px);
        animation: pl-reveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      }
      .pl-role {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--pl-muted);
        opacity: 0;
        transform: translateY(8px);
        animation: pl-reveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.72s forwards;
      }
      @keyframes pl-reveal {
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }

      .pl-meter {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 6px;
        opacity: 0;
        animation: pl-fade 0.6s ease 0.9s forwards;
      }
      @keyframes pl-fade {
        to {
          opacity: 1;
        }
      }
      .pl-progress {
        position: relative;
        width: 200px;
        max-width: 52vw;
        height: 2px;
        border-radius: 999px;
        background: var(--pl-line);
        overflow: hidden;
      }
      .pl-fill {
        position: absolute;
        inset: 0;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--pl-accent), var(--pl-accent2));
      }
      .pl-count {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.78rem;
        color: var(--pl-muted);
        font-variant-numeric: tabular-nums;
        min-width: 42px;
        text-align: right;
      }

      @media (prefers-reduced-motion: reduce) {
        .pl-stroke,
        .pl-name,
        .pl-role,
        .pl-meter {
          animation: none;
          opacity: 1;
          transform: none;
          filter: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite" aria-label="Loading">
      <div class="pl-inner">
        <svg class="pl-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="plg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="var(--pl-accent)" />
              <stop offset="1" stop-color="var(--pl-accent2)" />
            </linearGradient>
          </defs>
          <path class="pl-stroke" pathLength="100" d="M12 7L4 16L12 25" stroke="url(#plg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <path class="pl-stroke d2" pathLength="100" d="M20 7L28 16L20 25" stroke="url(#plg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="pl-name">Çlirim Sopa</div>
        <div class="pl-role">Software Developer</div>
        <div class="pl-meter">
          <span class="pl-progress"><span class="pl-fill" id="pl-fill"></span></span>
          <span class="pl-count"><span id="pl-num">0</span>%</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var pre = document.getElementById('preloader');
        var num = document.getElementById('pl-num');
        var fill = document.getElementById('pl-fill');
        var DURATION = 3200;
        var finished = false;

        function finish() {
          if (finished || !pre) return;
          finished = true;
          if (num) num.textContent = '100';
          if (fill) fill.style.width = '100%';
          document.documentElement.classList.remove('preloading');
          pre.classList.add('is-done');
          var removed = false;
          function rm() {
            if (removed) return;
            removed = true;
            if (pre && pre.parentNode) pre.parentNode.removeChild(pre);
          }
          pre.addEventListener('transitionend', function (e) {
            if (e.propertyName === 'transform') rm();
          });
          setTimeout(rm, 1300);
        }

        // Guaranteed completion — independent of requestAnimationFrame, which
        // is throttled/paused in background tabs and would otherwise leave the
        // loader stuck covering the page forever.
        setTimeout(finish, (reduce ? 500 : DURATION + 500));

        if (reduce) return;

        var start = null;
        function easeOutExpo(t) {
          return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
        }
        function step(ts) {
          if (finished) return;
          if (start === null) start = ts;
          var t = Math.min((ts - start) / DURATION, 1);
          var e = easeOutExpo(t);
          if (num) num.textContent = Math.round(e * 100);
          if (fill) fill.style.width = e * 100 + '%';
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            setTimeout(finish, 300);
          }
        }
        requestAnimationFrame(step);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
