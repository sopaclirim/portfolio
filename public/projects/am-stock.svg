<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="AM Stock Management dashboard preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56a2ff"/>
      <stop offset="1" stop-color="#2ad4e6"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56a2ff"/>
      <stop offset="1" stop-color="#2ad4e6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="150" height="500" fill="#0a101d"/>
  <rect x="26" y="30" width="30" height="30" rx="8" fill="url(#logo)"/>
  <text x="66" y="51" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef2f8">AM</text>
  <rect x="26" y="104" width="98" height="12" rx="6" fill="#56a2ff" opacity="0.9"/>
  <rect x="26" y="140" width="80" height="10" rx="5" fill="#2a3550"/>
  <rect x="26" y="170" width="88" height="10" rx="5" fill="#2a3550"/>
  <rect x="26" y="200" width="72" height="10" rx="5" fill="#2a3550"/>
  <rect x="26" y="230" width="84" height="10" rx="5" fill="#2a3550"/>

  <!-- Top bar -->
  <text x="184" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2f8">Stock Management</text>
  <rect x="600" y="32" width="170" height="30" rx="15" fill="#131d31"/>
  <circle cx="620" cy="47" r="5" fill="#2ad4e6"/>
  <rect x="634" y="43" width="90" height="8" rx="4" fill="#2a3550"/>

  <!-- Stat cards -->
  <g>
    <rect x="184" y="92" width="184" height="96" rx="14" fill="#131d31" stroke="#20304d" stroke-width="1"/>
    <rect x="204" y="112" width="70" height="9" rx="4.5" fill="#33415f"/>
    <text x="204" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#eef2f8">1,248</text>
    <text x="286" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#56a2ff">Products</text>
  </g>
  <g>
    <rect x="392" y="92" width="184" height="96" rx="14" fill="#131d31" stroke="#20304d" stroke-width="1"/>
    <rect x="412" y="112" width="60" height="9" rx="4.5" fill="#33415f"/>
    <text x="412" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#eef2f8">312</text>
    <text x="470" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2ad4e6">Low stock</text>
  </g>
  <g>
    <rect x="600" y="92" width="176" height="96" rx="14" fill="#131d31" stroke="#20304d" stroke-width="1"/>
    <rect x="620" y="112" width="66" height="9" rx="4.5" fill="#33415f"/>
    <text x="620" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#eef2f8">87</text>
    <text x="666" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#56a2ff">Orders</text>
  </g>

  <!-- Chart -->
  <rect x="184" y="212" width="360" height="256" rx="14" fill="#131d31" stroke="#20304d" stroke-width="1"/>
  <rect x="204" y="232" width="90" height="10" rx="5" fill="#33415f"/>
  <g>
    <rect x="212" y="380" width="34" height="60" rx="6" fill="url(#accent)" opacity="0.85"/>
    <rect x="262" y="340" width="34" height="100" rx="6" fill="url(#accent)" opacity="0.85"/>
    <rect x="312" y="300" width="34" height="140" rx="6" fill="url(#accent)" opacity="0.85"/>
    <rect x="362" y="352" width="34" height="88" rx="6" fill="url(#accent)" opacity="0.85"/>
    <rect x="412" y="288" width="34" height="152" rx="6" fill="url(#accent)"/>
    <rect x="462" y="330" width="34" height="110" rx="6" fill="url(#accent)" opacity="0.85"/>
  </g>

  <!-- Table -->
  <rect x="560" y="212" width="216" height="256" rx="14" fill="#131d31" stroke="#20304d" stroke-width="1"/>
  <rect x="580" y="232" width="80" height="10" rx="5" fill="#33415f"/>
  <g fill="#22304d">
    <rect x="580" y="264" width="176" height="30" rx="6"/>
    <rect x="580" y="304" width="176" height="30" rx="6"/>
    <rect x="580" y="344" width="176" height="30" rx="6"/>
    <rect x="580" y="384" width="176" height="30" rx="6"/>
    <rect x="580" y="424" width="176" height="30" rx="6"/>
  </g>
  <g fill="#2ad4e6">
    <circle cx="596" cy="279" r="4"/>
    <circle cx="596" cy="319" r="4"/>
    <circle cx="596" cy="359" r="4"/>
    <circle cx="596" cy="399" r="4"/>
    <circle cx="596" cy="439" r="4"/>
  </g>
</svg>
